# Entorno de GitHub Codespaces: la app (Python) + su base de datos MySQL.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: codespaces
      MYSQL_DATABASE: acceso_usuarios
      APP_HOST: 0.0.0.0
      APP_PORT: "5000"
      ABRIR_NAVEGADOR: "0"
      SEED_DEMO: "1"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: codespaces
      MYSQL_DATABASE: acceso_usuarios
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
